      <div class="dropdown d-inline-block" ngbDropdown>
        <button (click)="fetchNotifications(utilisateurAuthentifie?.personnel.rhPersonnel)" type="button" class="btn header-item noti-icon" id="page-header-notifications-dropdown" ngbDropdownToggle>
          <i class="bx bx-bell bx-tada"></i><small class="badge bg-danger">{{ totalNotificationCountUnread  }}</small>
        </button>
        <div class="dropdown-menu dropdown-menu-lg dropdown-menu-end p-0" aria-labelledby="page-header-notifications-dropdown" ngbDropdownMenu>
          <div class="p-3">
            <div class="row align-items-center">
              <div class="col">
                <h6 class="m-0">{{ 'NOTIFICATIONS' }} </h6>
              </div>
            </div>
          </div>
          <ngx-simplebar style="position: relative; height: 230px;">
            <a *ngFor="let notification of allNotifications" [href]="getNotificationLink(notification)" class="text-reset notification-item">

              <!-- Vous devez ajuster le contenu ici en fonction de la structure de vos notifications -->
              <div class="media">
                <div class="avatar-xs me-3">
                  <!-- Vous devez ajuster cette partie en fonction de la structure de vos notifications -->
                  <span class="avatar-title bg-primary rounded-circle font-size-16">
                            <i class="mdi mdi-bell"></i>
                        </span>
                </div>
                <div class="media-body">
                  <h6 class="mt-0 mb-1">{{ notification.type }}</h6>
                  <div class="font-size-12 text-muted">
                    <p class="mb-1"> {{ notification.message }}</p>
                    <p class="mb-0"><i class="mdi mdi-clock-outline"></i>Date: {{ notification.dateEnvoi |date:'dd MMMM yyyy':'?':'fr-FR' }}</p>
                  </div>
                </div>
              </div>
            </a>
            <br>
            <br>
            <div class="text-center" *ngIf="allNotifications.length == 0">
              <div>
                <i style="color: #d9534f; font-size: xxx-large" class='bx bxs-data'></i>
              </div>
              <div>
                <p style="font-size: large; padding-left: 2%; padding-right: 2%">Aucune notification disponible pour le moment!</p>
              </div>
            </div>
          </ngx-simplebar>
        </div>
      </div>
