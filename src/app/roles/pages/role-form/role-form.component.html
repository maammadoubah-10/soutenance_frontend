<div class="sj-card p-3 p-md-4">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <div>
      <h4 class="m-0" style="color:var(--sj-text)">{{ id ? 'Modifier le rôle' : 'Nouveau rôle' }}</h4>
      <div class="text-muted small">Associe des permissions à ce rôle.</div>
    </div>
    <a class="btn btn-outline-secondary" [routerLink]="['/espacedetravail/roles']">Retour</a>
  </div>

  <form (ngSubmit)="save()" #f="ngForm" class="row g-3" novalidate>
    <div class="col-12 col-md-6">
      <label class="form-label">Nom du rôle</label>
      <input name="nom" [(ngModel)]="model.nom" required class="sj-input" />
      <div class="text-danger small mt-1" *ngIf="f.submitted && !model.nom">Le nom est obligatoire.</div>
    </div>

    <div class="col-12">
      <label class="form-label">Permissions</label>
      <div class="row g-2">
        <div class="col-12 col-md-6" *ngFor="let p of allPermissions; trackBy: trackById">
          <label class="d-flex align-items-center gap-2 border rounded-3 p-2">
            <input type="checkbox"
                   [checked]="(model?.permissions ?? []).includes(p.id)"
                   (change)="onPermissionChange(p.id, $event)">
            <span><strong>{{ p.code }}</strong><br><span class="text-muted small">{{ p.description }}</span></span>
          </label>
        </div>
      </div>
    </div>

    <div *ngIf="errorMsg" class="alert alert-danger py-2">{{ errorMsg }}</div>

    <div class="d-flex justify-content-end gap-2">
      <a class="btn btn-outline-secondary" [routerLink]="['/espacedetravail/roles']">Annuler</a>
      <button type="submit" class="sj-btn-primary" [disabled]="saving || !f.form.valid">
        {{ id ? 'Enregistrer' : 'Créer' }}
      </button>
    </div>
  </form>
</div>
