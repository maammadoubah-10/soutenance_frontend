<!-- src/app/features/roles/pages/roles-list/roles-list.component.html -->
<div class="card">
  <div class="card-header">
    <h3>Rôles</h3>
    <a routerLink="/espacedetravail/roles/nouveau">+ Nouveau rôle</a>
  </div>

  <div class="card-body">
    <input [(ngModel)]="search" placeholder="Rechercher par nom…" />
    <button (click)="onSearch()">Rechercher</button>

    <div *ngIf="loading">Chargement…</div>

    <table class="table" *ngIf="!loading">
      <thead>
        <tr>
          <th>ID</th><th>Nom</th><th>Permissions</th><th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let r of items">
          <td>{{ r.id }}</td>
          <td>{{ r.nom }}</td>
          <td>{{ r.permissions?.length || 0 }}</td>
          <td>
            <a [routerLink]="['/espacedetravail/roles', r.id]">Modifier</a>
            <button (click)="remove(r.id)">Supprimer</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
