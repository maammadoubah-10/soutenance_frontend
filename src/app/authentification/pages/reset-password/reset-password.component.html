<div class="container py-4 max-w-480 mx-auto">
  <h3 class="mb-3">Réinitialisation du mot de passe</h3>

  <div *ngIf="checking">Vérification du lien…</div>

  <ng-container *ngIf="!checking">
    <div *ngIf="!valid" class="alert alert-warning mb-3">
      {{ reason || 'Lien invalide ou expiré. Demandez un nouveau lien.' }}
    </div>

    <div class="card p-3">
      <label class="form-label">Nouveau mot de passe</label>
      <input type="password" class="form-control mb-2"
             [(ngModel)]="motDePasse" name="mp" />

      <label class="form-label">Confirmer le mot de passe</label>
      <input type="password" class="form-control mb-2"
             [(ngModel)]="confirmationDeMotDePasse" name="mpc" />

      <div class="text-danger mb-2" *ngIf="error">{{ error }}</div>

      <button class="btn btn-primary w-100"
              (click)="submit()"
              [disabled]="saving || !valid">
        {{ saving ? 'Enregistrement…' : 'Valider' }}
      </button>
    </div>

    <div *ngIf="done" class="alert alert-success mt-3">
      Mot de passe modifié. Vous pouvez maintenant vous connecter.
      <button class="btn btn-link p-0" (click)="goLogin()">Se connecter</button>
    </div>
  </ng-container>
</div>
