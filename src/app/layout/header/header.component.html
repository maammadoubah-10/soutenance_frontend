<header class="header">
  <div class="actions">
    
   

    <!-- Bloc utilisateur -->
    <div class="user">
      <div class="avatar"></div>
      <div class="meta">

        <small class="role">Administrateur</small>

    <!-- Bouton déconnexion -->

    </button>
  </div>
</header>
